name: Android CI/CD

on:
  push:
    branches:
      - '**' # push 到任意分支都触发构建

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed "s/.*\"\(.*\)\"/\1/")
          echo "versionName=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Built version: $VERSION_NAME"

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apkPath=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChuBaichuan-TagAI-${{ steps.version.outputs.versionName }}
          path: ${{ steps.find_apk.outputs.apkPath }}
